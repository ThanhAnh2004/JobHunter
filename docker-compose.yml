version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: jobhunter-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: jobhunter
      MYSQL_ROOT_PASSWORD: your_mysql_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Job-Recruitment-Java/jobhunter.sql:/docker-entrypoint-initdb.d/jobhunter.sql
    networks:
      - jobhunter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pyour_mysql_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./Job-Recruitment-Java
      dockerfile: Dockerfile
    container_name: jobhunter-api
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/jobhunter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: your_mysql_password
      UPLOAD_FILE_BASE_URI: file:///app/upload/
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      GEMINI_API_KEY: ""
    volumes:
      - ./upload:/app/upload
    networks:
      - jobhunter-net

  frontend:
    build:
      context: ./Job-Recruitment_FE
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=
        - VITE_USE_PROXY=true
    container_name: jobhunter-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jobhunter-net

volumes:
  mysql-data:
  upload-data:

networks:
  jobhunter-net:
    driver: bridge
